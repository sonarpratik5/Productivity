<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">Productivity App Icon</title>
  <desc id="desc">Productivity brand mark in a white rounded square macOS icon with stronger contrast and subtle brand-tinted depth.</desc>
  <defs>
    <filter id="tileShadow" x="-14%" y="-14%" width="128%" height="140%">
      <feDropShadow dx="0" dy="22" stdDeviation="28" flood-color="#102B33" flood-opacity="0.12"/>
      <feDropShadow dx="0" dy="62" stdDeviation="56" flood-color="#102B33" flood-opacity="0.09"/>
    </filter>
    <linearGradient id="tileFill" x1="512" y1="92" x2="512" y2="932" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.62" stop-color="#FCFDFE"/>
      <stop offset="1" stop-color="#F2F5F8"/>
    </linearGradient>
    <radialGradient id="tealGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(304 252) rotate(35) scale(368 280)">
      <stop offset="0" stop-color="#51C7B7" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#51C7B7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="coralGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(778 770) rotate(-20) scale(244 200)">
      <stop offset="0" stop-color="#FF8A5B" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#FF8A5B" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="tileClip">
      <rect x="92" y="92" width="840" height="840" rx="188"/>
