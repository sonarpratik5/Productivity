  </defs>

  <rect width="1024" height="1024" fill="none"/>

  <g filter="url(#tileShadow)">
    <rect x="92" y="92" width="840" height="840" rx="188" fill="url(#tileFill)"/>
    <rect x="92.5" y="92.5" width="839" height="839" rx="187.5" fill="none" stroke="#D6DEE5"/>
  </g>

  <g clip-path="url(#tileClip)">
