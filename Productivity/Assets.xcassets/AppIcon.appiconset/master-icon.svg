    <rect x="92" y="92" width="840" height="840" rx="188" fill="url(#coralGlow)"/>
    <ellipse cx="516" cy="182" rx="286" ry="124" fill="#FFFFFF" opacity="0.92"/>
    <path d="M144 780c104-78 232-118 384-118 137 0 247 28 352 88v182H144z" fill="#EEF2F6"/>
    <path d="M148 770c103-68 224-103 363-103 124 0 235 24 361 79" fill="none" stroke="#FFFFFF" stroke-opacity="0.52" stroke-width="16" stroke-linecap="round"/>
  </g>

